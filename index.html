<script>
    // ⚠️ COLE SUA NOVA URL AQUI:
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnTO3k0uQGyEHiA1zBPyFtPWDcyldQDQz5G4OI0vqXNOaRkfL1hBr6_tTNuJi37Z9d/exec";

    const scenarios = [
        { title: "1. Bloqueio Criativo na Redação", desc: "Você precisa escrever um conto de aventura de duas páginas para a aula de Português, mas está olhando para a folha em branco há meia hora. Você não quer que a IA escreva a história por você, mas precisa de ideias de cenários, um nome legal para a protagonista e um mistério inicial." },
        { title: "2. O Desespero com Frações", desc: "Você tem exercícios sobre frações. O professor explicou o MMC, mas você esqueceu. Peça para a IA explicar o passo a passo de um jeito simples, como um amigo, usando exemplo de fatias de pizza." },
        { title: "3. Pesquisa com Palavras Difíceis", desc: "Trabalho sobre Tarsila do Amaral ou Grécia Antiga. O Google só mostra textos difíceis. Peça para a IA reescrever as informações mais importantes de um jeito fácil de entender para alguém de 11 anos." },
        { title: "4. Trabalho Manual sem Ideias", desc: "A professora pediu uma maquete da célula animal (ou Sistema Solar). Vocês estão sem dinheiro e precisam usar recicláveis de casa. Peçam sugestões criativas e baratas." },
        { title: "5. Preparação para a Prova de Geografia", desc: "Prova sobre biomas brasileiros. Você já estudou, mas quer testar conhecimentos. Peça para a IA criar um 'quiz' de múltipla escolha para você treinar, corrigindo uma por uma." },
        { title: "6. O Jeito Certo de Falar em Inglês", desc: "Apresentação em inglês gravada. Você tem o texto, mas quer que a IA corrija a gramática e te ensine (com dicas escritas) como pronunciar as palavras mais difíceis." },
        { title: "7. A Regra que Não Entra na Cabeça", desc: "Dúvida cruel: é 'mas' ou 'mais'? 'Por que' separado ou junto? Peça para a IA te ensinar um truque, rima ou regrinha divertida para nunca mais esquecer na prova." },
        { title: "8. Entendendo o Livro da Escola", desc: "Você leu o Capítulo 3 de um livro paradidático, mas achou confuso e precisa entregar um resumo. Peça para discutir o capítulo com a IA, mas avise para ELA NÃO DAR SPOILERS do resto." },
        { title: "9. Organização da Agenda", desc: "Sexta à tarde: 10 exercícios de mat, ler 20 páginas, cartaz de história, treino de esporte sábado de manhã e domingo livre para jogar. Peça ajuda para montar um cronograma realista." },
        { title: "10. Apresentação em Grupo", desc: "Apresentação de 10 minutos. Dois colegas são muito tímidos. Peça sugestões de como dividir o trabalho de forma justa sem forçar quem tem vergonha de falar muito lá na frente." }
    ];

    let currentScenario = 0;
    let groupName = "";

    function startApp() {
        const nameInput = document.getElementById("group-name").value.trim();
        const selectedScenario = document.getElementById("start-scenario").value;
        
        if (!nameInput) {
            alert("Por favor, digitem o nome do grupo!");
            return;
        }
        
        groupName = nameInput;
        currentScenario = parseInt(selectedScenario); 
        
        document.getElementById("screen-start").classList.add("hidden");
        document.getElementById("screen-scenario").classList.remove("hidden");
        loadScenario();
    }

    function loadScenario() {
        document.getElementById("progress-text").innerText = `Cenário ${currentScenario + 1} de ${scenarios.length}`;
        document.getElementById("scenario-title").innerText = scenarios[currentScenario].title;
        document.getElementById("scenario-desc").innerText = scenarios[currentScenario].desc;
        document.getElementById("prompt-input").value = ""; 
    }

    function saveAndContinue() {
        const promptText = document.getElementById("prompt-input").value.trim();
        
        if (!promptText) {
            alert("Vocês precisam escrever o prompt antes de continuar!");
            return;
        }

        const btn = document.getElementById("btn-save");
        btn.innerText = "Salvando... ⏳";
        btn.disabled = true;

        // Prepara os dados para envio via formulário (evita bloqueios do Google)
        const formData = new FormData();
        formData.append('groupName', groupName);
        formData.append('scenarioTitle', scenarios[currentScenario].title);
        formData.append('promptText', promptText);

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: formData
        })
        .then(() => {
            // Avança o cenário
            currentScenario++;
            if (currentScenario < scenarios.length) {
                loadScenario();
                btn.innerText = "Salvar e Continuar";
                btn.disabled = false;
            } else {
                // Fim dos cenários
                document.getElementById("screen-scenario").classList.add("hidden");
                document.getElementById("screen-end").classList.remove("hidden");
            }
        })
        .catch(error => {
            console.error(error);
            alert("Houve um erro ao tentar salvar. Verifiquem a internet e tentem de novo.");
            btn.innerText = "Salvar e Continuar";
            btn.disabled = false;
        });
    }
</script>
